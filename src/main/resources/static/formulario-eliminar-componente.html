<head>
    <title>Eliminar Componente</title>
    <meta charset="UTF-8">
</head>
<form id="deleteForm" method="POST" onsubmit="this.action='/componentes/' + document.getElementById('componenteId').value;">
    <input type="hidden" name="_method" value="DELETE">
    <label for="componenteId">ID del componente a eliminar:</label>
    <input type="number" id="componenteId" placeholder="Ej: 25" required>
    <button type="submit">Eliminar componente</button>
</form>
