<head>
    <title>Eliminar Ordenador</title>
    <meta charset="UTF-8">
</head>
<form id="deleteForm" method="POST" onsubmit="this.action='/ordenadores/' + document.getElementById('ordenadorId').value;">
    <input type="hidden" name="_method" value="DELETE">
    <label for="ordenadorId">ID del Pokémon a eliminar:</label>
    <input type="number" id="ordenadorId" placeholder="Ej: 25" required>
    <button type="submit">Eliminar Pokémon</button>
</form>
